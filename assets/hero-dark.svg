    <text x="28" y="248.8" xml:space="preserve" opacity="0">  <tspan fill="#58a6ff">"open_to"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"remote · full-time or contract"</tspan><set attributeName="opacity" to="1" begin="2.86s" fill="freeze"/></text>
