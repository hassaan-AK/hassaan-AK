name: Telemetry

on:
  schedule:
    - cron: '17 1 * * *' # daily, 06:17 in Lahore
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/telemetry.yml']

permissions:
  contents: write

concurrency:
  group: readme-write
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/telemetry.mjs
      - name: Render snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark
      - name: Commit
        run: |
          git config user.name "telemetry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore(telemetry): refresh dashboard"
          git pull --rebase --autostash && git push
